[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "manipilot"
version = "0.1.0"
description = "通用硬件执行平台：机械臂/摄像头/输入设备驱动抽象、任务运行时、插件承载与设备控制台"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
server = ["fastapi>=0.110", "uvicorn>=0.29", "httpx>=0.27", "jsonschema>=4.21"]
real = ["pyserial>=3.5", "numpy>=1.26", "opencv-python-headless>=4.9"]

[tool.setuptools]
packages = ["api", "agent", "drivers", "fakes", "runtime", "tasks", "adapters", "adapters.screen_ime", "adapters.vision", "adapters.uinav"]

[tool.pytest.ini_options]
testpaths = ["tests"]
